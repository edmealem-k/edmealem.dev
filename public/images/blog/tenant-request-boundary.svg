<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
  <title id="title">Tenant-aware request authorization flow</title>
  <desc id="desc">A tenant selector is resolved against a verified user, membership and permission are checked, then a tenant-scoped query runs. Any failed check is denied.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#090d16"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#71839d"/></marker>
    <marker id="deny" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#f87171"/></marker>
  </defs>
  <rect width="1200" height="490" rx="28" fill="url(#bg)"/>
  <text x="40" y="54" fill="#f3f6fb" font-family="Arial, sans-serif" font-size="25" font-weight="700">A tenant selector is only the start</text>
  <text x="40" y="82" fill="#9aa9bc" font-family="Arial, sans-serif" font-size="15">Build trusted context on the server before the handler touches tenant-owned data.</text>
  <g font-family="Arial, sans-serif">
    <path d="M131 292v28M367 292v28M603 292v28M839 292v28M1072 292v28M131 320h941M600 320v18" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#deny)"/>
    <path d="M234 209h26M470 209h26M706 209h26M942 209h26" stroke="#71839d" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="30" y="126" width="202" height="166" rx="18" fill="#101827" stroke="#34445e"/>
    <rect x="266" y="126" width="202" height="166" rx="18" fill="#101827" stroke="#34445e"/>
    <rect x="502" y="126" width="202" height="166" rx="18" fill="#101827" stroke="#34445e"/>
    <rect x="738" y="126" width="202" height="166" rx="18" fill="#101827" stroke="#34445e"/>
    <rect x="974" y="126" width="196" height="166" rx="18" fill="#101827" stroke="#34445e"/>

    <circle cx="58" cy="155" r="14" fill="#1e3a5f"/><text x="58" y="160" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700">1</text>
    <text x="82" y="160" fill="#93c5fd" font-size="13" font-weight="700" letter-spacing="1">SELECT</text>
    <text x="50" y="197" fill="#eef3fa" font-size="18" font-weight="700">Tenant slug / ID</text>
    <text x="50" y="224" fill="#9aa9bc" font-size="14">URL or trusted host</text>
    <text x="50" y="249" fill="#fbbf24" font-size="13">Untrusted until checked</text>

    <circle cx="294" cy="155" r="14" fill="#1e3a5f"/><text x="294" y="160" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700">2</text>
    <text x="318" y="160" fill="#93c5fd" font-size="13" font-weight="700" letter-spacing="1">AUTHENTICATE</text>
    <text x="286" y="197" fill="#eef3fa" font-size="18" font-weight="700">Verify identity</text>
    <text x="286" y="224" fill="#9aa9bc" font-size="14">Session or service</text>
    <text x="286" y="249" fill="#9aa9bc" font-size="14">credential is valid</text>

    <circle cx="530" cy="155" r="14" fill="#1e3a5f"/><text x="530" y="160" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700">3</text>
    <text x="554" y="160" fill="#93c5fd" font-size="13" font-weight="700" letter-spacing="1">AUTHORIZE TENANT</text>
    <text x="522" y="197" fill="#eef3fa" font-size="18" font-weight="700">Active membership</text>
    <text x="522" y="224" fill="#9aa9bc" font-size="14">User belongs to tenant</text>
    <text x="522" y="249" fill="#9aa9bc" font-size="14">and may perform action</text>

    <circle cx="766" cy="155" r="14" fill="#1e3a5f"/><text x="766" y="160" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700">4</text>
    <text x="790" y="160" fill="#93c5fd" font-size="13" font-weight="700" letter-spacing="1">CREATE CONTEXT</text>
    <text x="758" y="197" fill="#eef3fa" font-size="18" font-weight="700">TenantContext</text>
    <text x="758" y="224" fill="#9aa9bc" font-size="14">tenantId + role + status</text>
    <text x="758" y="249" fill="#9aa9bc" font-size="14">created on the server</text>

    <circle cx="1002" cy="155" r="14" fill="#14532d"/><text x="1002" y="160" text-anchor="middle" fill="#86efac" font-size="13" font-weight="700">5</text>
    <text x="1026" y="160" fill="#86efac" font-size="13" font-weight="700" letter-spacing="1">SCOPE DATA</text>
    <text x="996" y="197" fill="#eef3fa" font-size="18" font-weight="700">Tenant + resource</text>
    <text x="996" y="224" fill="#9aa9bc" font-size="14">tenant_id AND id</text>
    <text x="996" y="249" fill="#9aa9bc" font-size="14">in the final query</text>

    <rect x="470" y="345" width="260" height="84" rx="16" fill="#2a151a" stroke="#74333b"/>
    <circle cx="505" cy="383" r="16" fill="#7f1d1d"/>
    <path d="M499 377l12 12m0-12-12 12" stroke="#fecaca" stroke-width="2.5" stroke-linecap="round"/>
    <text x="535" y="378" fill="#fecaca" font-size="17" font-weight="700">Fail closed</text>
    <text x="535" y="402" fill="#d3a8aa" font-size="13">Unknown tenant, membership, or permission</text>
    <path d="M730 383h96" stroke="#f87171" stroke-width="2" marker-end="url(#deny)"/>
    <text x="850" y="378" fill="#fca5a5" font-size="15" font-weight="700">401 / 403 / 404</text>
    <text x="850" y="402" fill="#9aa9bc" font-size="13">No unscoped fallback</text>
  </g>
</svg>
